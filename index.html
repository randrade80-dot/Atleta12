<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f45">
<title>Treino ABCD</title>
<style>
:root{color-scheme:light dark;--bg:#eceef3;--cd:#fff;--ink:#0f1a33;--mu:#64708a;--ln:#dde1ea;--ac:#0f1f45;--on:#fff;--ok:#16a34a;--bad:#c0392b;--tr:#e3e7ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--cd:#131c36;--ink:#e9edf7;--mu:#93a0bd;--ln:#243050;--ac:#7aa2ff;--on:#07112b;--ok:#4ade80;--bad:#ff8a7a;--tr:#243050}}
:root[data-theme="dark"]{--bg:#0b1226;--cd:#131c36;--ink:#e9edf7;--mu:#93a0bd;--ln:#243050;--ac:#7aa2ff;--on:#07112b;--ok:#4ade80;--bad:#ff8a7a;--tr:#243050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:21px;margin:4px 0 10px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}.k{color:var(--mu);font-size:13px}.v{font-size:22px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{flex:1;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:12px;padding:9px 6px;font:inherit;font-weight:700}
.chip small{display:block;font-weight:500;font-size:11px;color:inherit;opacity:.8}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.b{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;background:var(--ac);color:var(--on)}.b.s{background:var(--tr);color:var(--ink)}.b.d{background:transparent;color:var(--bad)}.b.sm{padding:7px 11px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:12px}.acts .b{flex:1}
.nm{font-weight:700}.tag{display:inline-block;background:var(--tr);border-radius:20px;padding:2px 9px;font-size:12px;margin:4px 6px 0 0}
.hint{background:var(--bg);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px;color:var(--mu)}
.st{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:6px;align-items:center;margin:5px 0}.st.h{color:var(--mu);font-size:12px;text-align:center}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}.st input{text-align:center;padding:9px 4px}
.ck{height:40px;border-radius:10px;border:2px solid var(--mu);background:none;color:transparent;font-weight:700;font-size:18px}.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.nv{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nv button{flex:1;background:none;border:0;color:var(--mu);padding:9px 2px;font:inherit;font-size:12px}.nv button i{display:block;font-style:normal;font-size:20px}.nv button.on{color:var(--ac);font-weight:700}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.g3 .cd{margin:0;padding:10px}
.rw{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}.rw:first-child{border-top:0}
.up{color:var(--ok);font-weight:700}.ch{width:100%;height:auto}.tx{fill:var(--mu);font-size:10px}
.tr2{height:8px;border-radius:4px;background:var(--tr);overflow:hidden;margin-top:6px}.tr2 i{display:block;height:100%;background:var(--ok)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}h2{font-size:14px;color:var(--mu);margin:16px 2px 6px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app"></div><nav class="nv" id="nv"></nav>
<input type="file" id="fi" accept=".json,application/json" style="display:none" onchange="impJ(this)">
<script>
var K="treinoabcd-v1",PL={
A:{d:"Segunda",f:"Peito, Ombros, Tríceps e Quadríceps",e:[["Supino reto na máquina","3x10-12",90,"Peito estufado, escápulas retraídas"],["Supino inclinado na máquina","3x10-12",90,"Banco 30-45°, controle total"],["Peck deck voador","3x12-15",60,"Tempo 3s descida, 1s contrai no pico"],["Elevação lateral halter","3x12-15",60,"Sem balanço, cotovelo levemente flex."],["Tríceps na polia corda","3x12",60,"Cotovelo fixo ao lado do tronco"],["Cadeira extensora","3x12-15",60,"Pico 1s em cima, desce controlado"],["Panturrilha na máquina em pé","3x12-15",60,"+ opcional Goblet squat 2x10"]]},
B:{d:"Terça",f:"Costas, Trapézio, Bíceps e Posterior",e:[["Puxada frontal pegada aberta","3x10-12",90,"Puxa até queixo, peito aberto"],["Remada com peito apoiado","3x10-12",90,"Escápula fecha, sem puxar ombro"],["Pullover máquina ou polia","2x12-15",60,"Alongamento máximo sem perder lombar"],["Encolhimento ombros halteres","2x12",60,"Segura 1s em cima, trapézio"],["Rosca direta máquina / polia","3x12",60,"Cotovelo à frente do corpo"],["Rosca martelo","2x12",60,"Neutro, controle na descida"],["Mesa flexora","3x12-15",60,"Quadril colado, pico 1s"]]},
C:{d:"Quinta",f:"Peito, Ombros, Tríceps e Quadríceps",e:[["Chest press convergente máquina","3x10-12",90,"Cotovelada fecha, não travar"],["Crucifixo na polia alta","3x12-15",60,"Braço semi-flex, cruza levemente"],["Desenvolvimento ombros máquina","3x10-12",90,"Costas apoiadas, não arquear"],["Elevação lateral na polia","3x12-15",60,"Cabo atrás do corpo, tensão contínua"],["Tríceps máquina","3x12",60,"Punho neutro, extensão completa"],["Leg press 45°","3x10-15",90,"Pés largura ombro, joelho 90°"],["Panturrilha sentada","3x12-15",60,"Amplitude total, 2s em cima"]]},
D:{d:"Sexta",f:"Costas, Trapézio, Bíceps e Posterior",e:[["Puxada frontal pegada neutra","3x10-12",90,"Pega fechada, cotovelo junto ao corpo"],["Remada baixa na polia","3x10-12",90,"Tronco 90°, puxa no umbigo"],["Remada unilateral máquina apoio","3x10-12",60,"Cada lado, sem girar tronco"],["Face pull na polia","3x12-15",60,"Corda na altura olhos, rotação externa"],["Rosca Scott máquina","3x10-12",60,"Axila apoiada, sem roubar"],["Rosca concentrada","2x12",60,"Cada braço, cotovelo no joelho"],["Mesa flexora sentada","3x12-15",60,"+ opcional Stiff halter 2x10"]]}};
var S,tab="t",tr,pe="",MD={1:"A",2:"B",3:"C",4:"C",5:"D",6:"A",0:"A"};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
S=Object.assign({sess:[],draft:{},meta:{},inc:2},S||{});tr=MD[new Date().getDay()];
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Não consegui salvar. O armazenamento do navegador pode estar cheio. Exporte um backup.")}}
function $(i){return document.getElementById(i)}
function h(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fn(n){return (n||0).toLocaleString("pt-BR",{maximumFractionDigits:1})}
function num(x){return parseFloat(String(x).replace(",","."))||0}
function p2(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function fd(s){return s.split("-").reverse().join("/")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function P(r){var m=/(\d+)x(\d+)(?:-(\d+))?/.exec(r[1]);return {n:r[0],s:+m[1],lo:+m[2],hi:+(m[3]||m[2]),d:r[2],o:r[3]}}
function hist(n){return S.sess.filter(function(s){return s.ex[n]}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:0}).map(function(s){var st=s.ex[n].filter(function(z){return z.r>0||z.ok});return {s:s,st:st,mx:st.reduce(function(a,z){return Math.max(a,z.c)},0)}}).filter(function(z){return z.st.length})}
function stx(a){return a.map(function(z){return fn(z.c)+" × "+z.r}).join(" · ")}
function prog(r,l){return l.st.length>=r.s&&l.st.filter(function(z){return z.r>=r.hi}).length>=r.s}
function rows(i){
  var r=P(PL[tr].e[i]),d=S.draft[tr]&&S.draft[tr][r.n];if(d)return d;
  var l=hist(r.n).pop(),a=[];
  for(var j=0;j<r.s;j++){var c="";if(l){var q=l.st[j]||l.st[l.st.length-1];c=q.c+(prog(r,l)?S.inc:0)}a.push({c:c===""?"":String(c).replace(".",","),r:"",ok:false})}
  return a;
}
function hint(r){
  var l=hist(r.n).pop();if(!l)return "Sem histórico ainda: escolha uma carga que permita boa técnica.";
  return "Última vez ("+fd(l.s.data)+"): "+stx(l.st)+(prog(r,l)?"<br>Você fez "+r.hi+" repetições em todas as séries. Sugestão: subir "+fn(S.inc)+" kg (já preenchido; ajuste como preferir).":"<br>Mantenha a carga até chegar a "+r.hi+" repetições em todas as séries.");
}
function put(i,a){var r=P(PL[tr].e[i]);(S.draft[tr]=S.draft[tr]||{})[r.n]=a;save()}
function dset(i,j,k,v){var a=rows(i);a[j][k]=v;put(i,a)}
function tgl(i,j){var r=P(PL[tr].e[i]),a=rows(i);a[j].ok=!a[j].ok;if(a[j].ok&&!num(a[j].r))a[j].r=String(r.hi);put(i,a);render()}
function dadd(i){var a=rows(i),l=a[a.length-1];a.push({c:l?l.c:"",r:"",ok:false});put(i,a);render()}
function setTr(k){tr=k;render()}
function clr(){if(confirm("Limpar o que foi digitado neste treino?")){delete S.draft[tr];save();render()}}
function finish(){
  var d=S.draft[tr]||{},ex={},n=0,up=[];
  Object.keys(d).forEach(function(k){var st=d[k].map(function(z){return {c:num(z.c),r:num(z.r),ok:!!z.ok}}).filter(function(z){return z.r>0||z.ok});if(st.length){ex[k]=st;n++}});
  if(!n){alert("Preencha ao menos uma série (carga e repetições) antes de salvar.");return}
  Object.keys(ex).forEach(function(k){var hs=hist(k),m=ex[k].reduce(function(a,z){return Math.max(a,z.c)},0);if(hs.length&&m>hs[hs.length-1].mx)up.push(k+" (+"+fn(m-hs[hs.length-1].mx)+" kg)")});
  S.sess.push({id:uid(),data:iso(new Date()),tr:tr,ex:ex});delete S.draft[tr];save();render();
  alert("Treino salvo! "+n+" exercício(s) registrado(s)."+(up.length?"\nCarga maior que a última vez em: "+up.join(", ")+".":"")+"\nSubir a carga é uma sugestão, não uma obrigação: priorize a técnica.");
}
function vT(){
  var x='<div class="chips">'+Object.keys(PL).map(function(k){return '<button class="chip'+(tr===k?" on":"")+'" onclick="setTr(\''+k+'\')">'+k+'<small>'+PL[k].d.slice(0,3)+'</small></button>'}).join("")+'</div>';
  x+='<div class="cd"><b>Treino '+tr+' · '+PL[tr].d+'</b><div class="mu">'+PL[tr].f+'</div><div class="mu" style="margin-top:6px">Aquecimento 5 a 10 min. Tempo: 2s sobe, 3s desce.</div></div>';
  PL[tr].e.forEach(function(e,i){
    var r=P(e),rs=rows(i),m=S.meta[r.n];
    x+='<div class="cd"><div class="nm">'+(i+1)+'. '+h(r.n)+'</div><span class="tag">'+r.s+' × '+(r.lo===r.hi?r.hi:r.lo+"-"+r.hi)+' reps</span><span class="tag">descanso '+r.d+'s</span>'+(m?'<span class="tag">meta '+fn(m)+' kg</span>':'')+'<div class="mu" style="margin-top:6px">'+h(r.o)+'</div><div class="hint">'+hint(r)+'</div>'
     +'<div class="st h"><span>#</span><span>Carga (kg)</span><span>Repetições</span><span></span></div>'
     +rs.map(function(z,j){return '<div class="st"><span class="mu">'+(j+1)+'</span><input value="'+h(z.c)+'" inputmode="decimal" onchange="dset('+i+','+j+',\'c\',this.value)"><input value="'+h(z.r)+'" inputmode="decimal" placeholder="'+r.hi+'" onchange="dset('+i+','+j+',\'r\',this.value)"><button class="ck'+(z.ok?" on":"")+'" onclick="tgl('+i+','+j+')">✓</button></div>'}).join("")
     +'<button class="b s sm" style="margin-top:4px" onclick="dadd('+i+')">+ série</button></div>';
  });
  return x+'<div class="acts"><button class="b s" onclick="clr()">Limpar</button><button class="b" onclick="finish()">Salvar treino</button></div>';
}
function chart(pts,u){
  var W=320,H=150,Q=30,ys=pts.map(function(a){return a[1]}),mn=Math.min.apply(0,ys),mx=Math.max.apply(0,ys);if(mn===mx){mn-=1;mx+=1}
  var t0=+new Date(pts[0][0]),t1=+new Date(pts[pts.length-1][0]);
  function X(d){return t1===t0?W/2:Q+(new Date(d)-t0)/(t1-t0)*(W-Q-10)}function Y(v){return H-22-(v-mn)/(mx-mn)*(H-42)}
  return '<svg viewBox="0 0 '+W+' '+H+'" class="ch"><path d="'+pts.map(function(a,i){return (i?"L":"M")+X(a[0]).toFixed(1)+" "+Y(a[1]).toFixed(1)}).join("")+'" fill="none" stroke="var(--ac)" stroke-width="2.5"/>'+pts.map(function(a){return '<circle cx="'+X(a[0]).toFixed(1)+'" cy="'+Y(a[1]).toFixed(1)+'" r="3.5" fill="var(--ac)"/>'}).join("")
   +'<text x="2" y="12" class="tx">'+fn(mx)+' '+u+'</text><text x="2" y="'+(H-24)+'" class="tx">'+fn(mn)+'</text><text x="'+Q+'" y="'+(H-4)+'" class="tx">'+fd(pts[0][0]).slice(0,5)+'</text><text x="'+(W-8)+'" y="'+(H-4)+'" text-anchor="end" class="tx">'+fd(pts[pts.length-1][0]).slice(0,5)+'</text></svg>';
}
function setPe(v){pe=v;render()}
function setMeta(v){var n=num(v);if(n>0)S.meta[pe]=n;else delete S.meta[pe];save();render()}
function vP(){
  var x='<h1>Progresso das cargas</h1><select onchange="setPe(this.value)">'+Object.keys(PL).map(function(k){return '<optgroup label="Treino '+k+' · '+PL[k].d+'">'+PL[k].e.map(function(e){return '<option'+(e[0]===pe?" selected":"")+'>'+h(e[0])+'</option>'}).join("")+'</optgroup>'}).join("")+'</select>';
  if(!pe)pe=PL.A.e[0][0];
  var hs=hist(pe);
  if(!hs.length)x+='<div class="cd mu" style="margin-top:10px">Nenhum registro deste exercício ainda. Salve um treino para ver a evolução da carga.</div>';
  else{
    var f=hs[0].mx,c=hs[hs.length-1].mx,m=S.meta[pe];
    x+='<div class="g3" style="margin-top:10px"><div class="cd"><div class="k">Inicial</div><div class="v">'+fn(f)+'</div><div class="k">kg</div></div><div class="cd"><div class="k">Atual</div><div class="v">'+fn(c)+'</div><div class="k">kg</div></div><div class="cd"><div class="k">Variação</div><div class="v">'+(c-f>0?"+":"")+fn(c-f)+'</div><div class="k">kg</div></div></div>';
    if(m)x+='<div class="cd"><div class="k">Meta: '+fn(m)+' kg ('+Math.min(100,Math.round(c/m*100))+'%)</div><div class="tr2"><i style="width:'+Math.min(100,c/m*100)+'%"></i></div></div>';
    x+='<div class="cd"><b>Maior carga por treino</b>'+chart(hs.map(function(z){return [z.s.data,z.mx]}),"kg")+'</div><div class="cd"><b>Sessões</b>';
    x+=hs.map(function(z,i){var d=i?z.mx-hs[i-1].mx:0;return '<div class="rw"><span>'+fd(z.s.data)+'<div class="mu">'+stx(z.st)+'</div></span><span class="'+(d>0?"up":"mu")+'">'+(i?(d>0?"+":"")+fn(d)+" kg":"início")+'</span></div>'}).reverse().join("")+'</div>';
  }
  x+='<div class="cd"><label>Meta de carga para este exercício (kg, opcional)</label><input inputmode="decimal" value="'+(S.meta[pe]||"")+'" onchange="setMeta(this.value)"></div>';
  var ss=S.sess.slice().sort(function(a,b){return a.data<b.data?1:-1}).slice(0,8);
  if(ss.length)x+='<h2>Treinos salvos</h2><div class="cd">'+ss.map(function(s){return '<div class="rw"><span>'+fd(s.data)+' · Treino '+s.tr+'<div class="mu">'+Object.keys(s.ex).length+' exercício(s)</div></span><button class="b d sm" onclick="delS(\''+s.id+'\')">Excluir</button></div>'}).join("")+'</div>';
  return x;
}
function delS(id){if(confirm("Excluir este treino do histórico?")){S.sess=S.sess.filter(function(s){return s.id!==id});save();render()}}
function vA(){
  return '<h1>Ajustes</h1><div class="cd"><label style="margin-top:0">Aumento sugerido de carga (kg)</label><input inputmode="decimal" value="'+S.inc+'" onchange="S.inc=num(this.value)||2;save();render()"><p class="mu">Quando você completa o máximo de repetições em todas as séries, o app sugere esse aumento no treino seguinte.</p></div>'
   +'<div class="cd"><b>Dicas da ficha</b><p class="mu">Descanso: 90s nos exercícios compostos e 60s nos isoladores. Se fizer 12 repetições fácil nas 3 séries, aumente 2 kg no próximo treino. Se sentir dor aguda, interrompa e avise o professor. Qualidade técnica acima de carga. Este app não é prescrição médica.</p></div>'
   +'<div class="cd"><b>Seus dados</b><p class="mu">Ficam salvos só neste navegador, neste aparelho. Nada é enviado a servidores. Se limpar os dados do navegador, tudo some, então exporte backups.</p><div class="acts"><button class="b s" onclick="expJ()">Salvar backup</button><button class="b s" onclick="$(\'fi\').click()">Restaurar</button></div><div class="acts"><button class="b d" onclick="wipe()">Apagar tudo</button></div></div>';
}
function dl(name,txt,type){
  var fb=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()};
  try{if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(!d){fb();return}d.save({filename:name,data:new Blob([txt],{type:type})}).catch(function(e){if(!e||e.code!=="declined")alert("Não consegui salvar o arquivo.")})}).catch(fb);return}}catch(e){}
  fb();
}
function expJ(){dl("treino-abcd-"+iso(new Date())+".json",JSON.stringify({app:"abcd",s:S}),"application/json")}
function impJ(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||j.app!=="abcd"||!j.s||!Array.isArray(j.s.sess))throw 1;if(!confirm("Substituir os dados atuais pelos do backup?"))return;S=Object.assign({sess:[],draft:{},meta:{},inc:2},j.s);save();render();alert("Backup restaurado.")}catch(e){alert("Esse arquivo não parece ser um backup deste app.")}};r.readAsText(f);inp.value=""}
function wipe(){if(confirm("Apagar TODOS os registros? Isso não pode ser desfeito.")&&confirm("Tem certeza? Faça um backup antes, se ainda não fez.")){S={sess:[],draft:{},meta:{},inc:2};save();render()}}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  $("app").innerHTML=({t:vT,p:vP,a:vA})[tab]();
  $("nv").innerHTML=[["t","🏋️","Treino"],["p","📈","Progresso"],["a","⚙️","Ajustes"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join("");
}
render();
try{if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}}catch(e){}
</script>
</body>
</html>
